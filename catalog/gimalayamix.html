<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/catalog/catalog-style.css">
</head>

<body>

    <header>
        <div class="container header">
            <div class="header__logo">
                <h4><a href="/">Плантация</a></h4>
            </div>
            <ul class="header__nav">
                <li><a class="header__link" href="/catalog">Каталог</a></li>
                <li><a class="header__link" href="/actions">Акции</a></li>
                <li><a class="header__link" href="#contacts">Контакты</a></li>
            </ul>
            <div class="header__bag">
                <a href="#"><img src="/images/bag.svg" alt=""></a>
                </div>
        </div>
    </header>

<main class="container">

</main>

<footer>
<!-- Contacts & Feedback -->
 <div class="container footer">
        <h2><a id="contacts"></a>Контакты</h2>

    <div class="footer__columns">
        <div class="footer__contacts">
            <div class="footer__address">
                <h4>Адрес магазина:</h4>
                <p>Россия, г. Санкт-Петербург,<br> наб. Pеки Карповки, 5 корпус П</p>
            </div>
            <div class="footer__phone">
                <h4>Телефон:</h4>
                <p>+7-999-999-99-99</p>
            </div>
            <div class="footer__email">
                <h4>E-mail:</h4>
                <p>contact@plantacia.ru</p>
            </div>
            <div class="footer__icons">
                <h4>Соцсети</h4>
                <a href="#"><img src="/images/telegram.svg" alt="telegram" target="_blank"></a>
                <a href="https://youtube.com"><img src="/images/youtube.svg" alt="youtube" target="_blank"></a>
                <a href="https://vk.com/mikastan"><img src="/images/vk.svg" alt="vk" target="_blank"></a>
            </div>
        </div>
    
        <div class="footer__map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3993.621817401018!2d30.317862969157705!3d59.96846004930196!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1z0KDQvtGB0YHQuNGPLCDQsy4g0KHQsNC90LrRgi3Qn9C10YLQtdGA0LHRg9GA0LMsINC90LDQsS4gUNC10LrQuCDQmtCw0YDQv9C-0LLQutC4LCA1INC60L7RgNC_0YPRgSDQnw!5e0!3m2!1sru!2sru!4v1737200882726!5m2!1sru!2sru" width="460" height="352" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <!-- <img src="images/map.png" alt="Карта"> -->
        </div>
    
        <div class="footer__feedback">
            <h4>Обратная связь</h4>
            <form action="/feedback" method="get">
                <input placeholder="Ваше имя" name="name">
                <input type="email" placeholder="Ваш email" name="email" required>
                <textarea name="question" placeholder="Ваш вопрос"></textarea>
                <input type="submit" value="Отправить">
            </form>
        </div>
    </div>
</div>
</footer>
